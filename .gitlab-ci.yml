image: python:3.12

pages:
  stage: build
  script:
    - pip install --no-cache-dir -r dependencies.txt
    - pip install --no-cache-dir -r chart-dependencies.txt
    - python scripts/build_results_charts.py
    - FLASK_APP=app.py flask freeze
    - python scripts/check_static_site.py
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # No runners will run on branches other than main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
